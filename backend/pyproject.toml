[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-signal-backend"
version = "0.1.0"
description = "Backend for Secret Signal game"
authors = [{name = "Your Name"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "redis>=5.0.0",
    "pydantic-settings>=2.11.0",
    "asyncpg==0.31.0",
    "greenlet>=3.2.5",
    "email-validator>=2.3.0",
    "passlib>=1.7.4",
    "httpx>=0.28.1",
    "google-auth>=2.50.0",
    "requests>=2.32.5",
    "pyjwt>=2.13.0",
    "bcrypt==4.0.1",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "mlflow>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff==0.15.20",
    "mypy>=1.0.0",
    "pytest-asyncio>=0.23.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "mlflow>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
asyncio_mode = "auto"
