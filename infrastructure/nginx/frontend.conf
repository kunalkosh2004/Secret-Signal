# =============================================================================
# Secret Signal — NGINX Frontend Configuration
# Serves static React build + proxies API/WebSocket to backend
# =============================================================================

upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ------------------------------------------------------------------
    # Static assets — aggressive caching (Vite hashes filenames)
    # ------------------------------------------------------------------
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # API proxy → backend
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ------------------------------------------------------------------
    # Health check proxy (for load balancers)
    # ------------------------------------------------------------------
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
    }

    location = /readiness {
        proxy_pass http://backend_api/readiness;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------------
    # WebSocket proxy
    # ------------------------------------------------------------------
    location /ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (games can last 10+ minutes)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ------------------------------------------------------------------
    # SPA fallback — React Router handles all other routes
    # ------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # Deny hidden files
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
