# =============================================================================
# Secret Signal — Production Docker Compose (Oracle Cloud Always Free)
# =============================================================================
# Runs on a single Oracle Cloud ARM instance (4 OCPU, 24GB RAM)
# Services: PostgreSQL, Redis, Backend, Nginx (reverse proxy + SSL)
# =============================================================================

services:
  # ===========================================================================
  # DATA STORES
  # ===========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: secret_signal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secret_signal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: secret_signal_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===========================================================================
  # APPLICATION
  # ===========================================================================

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: secret_signal_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secret_signal}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN}
      ALLOWED_ORIGINS: '["https://${DOMAIN}","https://www.${DOMAIN}"]'
      DEBUG: "false"
      LOG_LEVEL: info
      ENVIRONMENT: production
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ===========================================================================
  # REVERSE PROXY + SSL
  # ===========================================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: secret_signal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certbot_data:/etc/letsencrypt
      - nginx_www_data:/var/www/certbot
    networks:
      - internal
    depends_on:
      - backend

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  nginx_certbot_data:
  nginx_www_data:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  internal:
    driver: bridge
